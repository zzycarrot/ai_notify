[package]
name = "ai_notify"
version = "0.1.0"
edition = "2021"

[dependencies]
active-win-pos-rs = "0.9"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray"] }
objc2-app-kit = "0.2"
core-foundation = "0.9"
core-foundation-sys = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.0"
lazy_static = "1.4"
reqwest = { version = "0.11", features = ["json"], optional = true }

# === Candle AI Framework (Local LLM Inference) ===
# Core library with Metal GPU acceleration for Apple Silicon
candle-core = { version = "0.8.0", features = ["metal"] }
# Neural network operations
candle-nn = "0.8.0"
# Pre-defined model architectures (includes Qwen2/3 support)
candle-transformers = "0.8.0"
# Tokenizer with comprehensive Unicode support
tokenizers = { version = "0.19.1", features = ["onig"] }

[features]
default = []
huggingface-api = ["reqwest"]